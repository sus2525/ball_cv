[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ball-cv"
version = "0.1.0"
description = "MVP pipeline for football ball detection, tracking and field-coordinate analysis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40,<2",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
  "ultralytics-opencv-headless>=8.4,<9",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.13,<1",
]

[project.scripts]
ball-cv = "ball_cv.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ball_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
